<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form | Lab 02</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ===== SOFT MAROON & ROSEWOOD PALETTE ===== */
    :root {
      --bg: #120d11;                  /* Dark warm black-cherry */
      --card: rgba(27, 20, 26, 0.75);   /* Glassy dark maroon container */
      --card-border: rgba(122, 60, 80, 0.25);
      --line: #2b1d25;                /* Borders */
      
      --maroon: #7a2e43;              /* Deep rosewood/maroon */
      --maroon-hover: #923a52;        
      --maroon-light: #d68ca1;        /* Soft dusty rose accent */
      --gold: #caa894;                /* Soft warm taupe/gold */
      
      --ink: #f3e8ee;                 /* Warm cream main text */
      --muted: #a6939d;              /* Secondary muted text */
      
      --heading-font: "Bricolage Grotesque", "Trebuchet MS", Arial, sans-serif;
      --body-font: "DM Sans", "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--body-font);
      background:
        radial-gradient(ellipse 80% 500px at 50% 0%, rgba(122, 46, 67, 0.22), transparent 70%),
        var(--bg);
      color: var(--ink);
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    #header {
      position: relative;
      padding: 48px 20px 32px;
      text-align: center;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(to bottom, transparent 30%, var(--bg) 100%),
        linear-gradient(rgba(202, 168, 148, .04) 1px, transparent 1px) 0 0 / 36px 36px,
        linear-gradient(90deg, rgba(202, 168, 148, .04) 1px, transparent 1px) 0 0 / 36px 36px;
    }

    .header-badge {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px;
      display: inline-block;
    }

    #title {
      font-family: var(--heading-font);
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -1.2px;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--maroon-light);
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    /* MAIN CONTENT & LOGIN CARD */
    #content {
      flex: 1;
      width: 90%;
      max-width: 460px;
      margin: 48px auto;
      padding: 40px 32px;
      background: var(--card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--card-border);
      border-top: 3px solid var(--maroon-light);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }

    .login-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 20px;
      border-radius: 12px;
      background: rgba(122, 46, 67, 0.2);
      border: 1px solid rgba(214, 140, 161, 0.25);
      color: var(--maroon-light);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: 0.2px;
    }

    /* INPUT STYLING */
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      background: rgba(18, 13, 17, 0.8);
      border: 1px solid rgba(122, 60, 80, 0.35);
      border-radius: 10px;
      color: #ffffff;
      font-family: var(--body-font);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--maroon-light);
      box-shadow: 0 0 0 3px rgba(214, 140, 161, 0.18);
    }

    /* BUTTONS STYLING */
    .form-actions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    input[type="submit"] {
      flex: 2;
      padding: 12px 20px;
      background: var(--maroon);
      border: 1px solid var(--maroon);
      border-radius: 10px;
      color: #ffffff;
      font-family: var(--body-font);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    input[type="submit"]:hover {
      background: var(--maroon-hover);
      border-color: var(--maroon-hover);
      box-shadow: 0 4px 14px rgba(122, 46, 67, 0.35);
    }

    input[type="reset"] {
      flex: 1;
      padding: 12px 20px;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      font-family: var(--body-font);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    input[type="reset"]:hover {
      border-color: var(--maroon-light);
      color: #ffffff;
    }

    /* FOOTER */
    #footer {
      background-color: #0b0709;
      color: var(--muted);
      padding: 24px 20px;
      text-align: center;
      border-top: 1px solid var(--line);
    }

    #footnote {
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      #header { padding: 36px 15px 24px; }
      #content { margin: 28px auto; padding: 28px 20px; }
      .form-actions { flex-direction: column; }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div id="header">
    <span class="header-badge">TTTM2113 &bull; Lab 02</span>
    <h1 id="title">Login Form</h1>
    <a href="index.html" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
      <span>Back to Form Menu</span>
    </a>
  </div>

  <!-- Main Content -->
  <div id="content">

    <div class="login-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    </div>

    <form action="http://lrgs.ftsm.ukm.my/users/a123456/lab-2/process_login.php" method="post">
      
      <div class="form-grid">

        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" autofocus required>
        </div>

        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" required>
        </div>

      </div>

      <input type="hidden" name="matricnum" value="a218815">

      <div class="form-actions">
        <input type="submit" name="login_form" value="Login">
        <input type="reset" value="Reset">
      </div>

    </form>

  </div>

  <!-- Footer -->
  <div id="footer">
    <span id="footnote">Somesh (A218815) &bull; Web Programming &#64; UKM</span>
  </div>

</body>
</html>
