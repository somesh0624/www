<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Computing Skills | Somesh</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
  
    :root {
      --bg: #120d11;                  
      --bg-alt: #171116;              
      --card: rgba(27, 20, 26, 0.75);   
      --card-border: rgba(122, 60, 80, 0.25);
      --line: #2b1d25;                
      
      --maroon: #7a2e43;              
      --maroon-hover: #923a52;        
      --maroon-light: #d68ca1;        
      --gold: #caa894;                
      
      --ink: #f3e8ee;                 
      --muted: #a6939d;              
      
      --heading-font: "Bricolage Grotesque", "Trebuchet MS", Arial, sans-serif;
      --body-font: "DM Sans", "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--body-font);
      background:
        radial-gradient(ellipse 80% 500px at 50% 0%, rgba(122, 46, 67, 0.22), transparent 70%),
        var(--bg);
      color: var(--ink);
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    #header {
      position: relative;
      padding: 48px 20px 36px;
      text-align: center;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(to bottom, transparent 30%, var(--bg) 100%),
        linear-gradient(rgba(202, 168, 148, .04) 1px, transparent 1px) 0 0 / 36px 36px,
        linear-gradient(90deg, rgba(202, 168, 148, .04) 1px, transparent 1px) 0 0 / 36px 36px;
    }

    #title {
      font-family: var(--heading-font);
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: -1px;
      color: #ffffff;
      margin: 0;
    }

    /* NAVIGATION MENU IFRAME */
    #menu {
      background-color: transparent;
      border-bottom: 1px solid var(--line);
      padding: 0;
    }

    #iframe {
      display: block;
      width: 100%;
      height: 55px;
      border: none;
      background-color: transparent;
    }

    /* MAIN CONTENT CONTAINER */
    #content {
      flex: 1;
      width: 92%;
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px 0;
    }

    /* SKILLS GRID */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px;
    }

    .skill-card {
      background: var(--card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--card-border);
      border-top: 3px solid var(--maroon-light);
      border-radius: 16px;
      padding: 28px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .skill-card:hover {
      transform: translateY(-4px);
      border-color: rgba(214, 140, 161, 0.4);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4), 0 0 20px rgba(122, 46, 67, 0.25);
    }

    .skill-category {
      font-family: var(--heading-font);
      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sub-group-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--gold);
      margin: 14px 0 8px;
    }

    /* BADGES / PILLS */
    .pill-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .skill-pill {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(122, 46, 67, 0.18);
      border: 1px solid rgba(214, 140, 161, 0.25);
      border-radius: 20px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .skill-pill:hover {
      background: var(--maroon);
      color: #ffffff;
      border-color: var(--maroon-light);
      transform: scale(1.04);
    }

    /* FOOTER */
    #footer {
      background-color: #0b0709;
      color: var(--muted);
      padding: 24px 20px;
      text-align: center;
      border-top: 1px solid var(--line);
    }

    #footnote {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.4px;
      color: var(--muted);
    }

    /* RESPONSIVE LAYOUT */
    @media (max-width: 768px) {
      .skills-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    @media (max-width: 600px) {
      #header {
        padding: 36px 15px 28px;
      }

      #title {
        font-size: 26px;
      }

      #content {
        width: 90%;
        margin: 28px auto;
      }

      #iframe {
        height: 60px;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div id="header">
    <h1 id="title">My Computing Skills</h1>
  </div>

  <!-- Navigation Menu -->
  <div id="menu">
    <iframe
      id="iframe"
      src="menu.html"
      title="Menu"
      allowtransparency="true">
    </iframe>
  </div>

  <!-- Main Content -->
  <div id="content">
    <div class="skills-grid">

      <!-- Programming Languages -->
      <article class="skill-card">
        <h2 class="skill-category">Programming Languages</h2>
        
        <div class="sub-group-title">Compiled Languages</div>
        <div class="pill-container">
          <span class="skill-pill">C++</span>
          <span class="skill-pill">Java</span>
        </div>

        <div class="sub-group-title">Scripting Languages</div>
        <div class="pill-container">
          <span class="skill-pill">Python</span>
        </div>
      </article>

      <!-- Tools & IDEs -->
      <article class="skill-card">
        <h2 class="skill-category">Tools &amp; IDEs</h2>
        <div class="sub-group-title">Development Environments</div>
        <div class="pill-container">
          <span class="skill-pill">Visual Studio</span>
          <span class="skill-pill">Android Studio</span>
        </div>
      </article>

      <!-- Graphics & Design -->
      <article class="skill-card">
        <h2 class="skill-category">Graphics &amp; Design</h2>
        <div class="sub-group-title">Creative Tools</div>
        <div class="pill-container">
          <span class="skill-pill">Adobe Photoshop</span>
          <span class="skill-pill">Canva</span>
        </div>
      </article>

      <!-- Certifications -->
      <article class="skill-card">
        <h2 class="skill-category">Certifications</h2>
        <div class="sub-group-title">Professional Credentials</div>
        <div class="pill-container">
          <span class="skill-pill">CCNA</span>
          <span class="skill-pill">MCSE</span>
        </div>
      </article>

    </div>
  </div>

  <!-- Footer -->
  <div id="footer">
    <span id="footnote">Web Programming &bull; UKM</span>
  </div>

</body>
</html>
