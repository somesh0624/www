<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Personal Pages | Lab 01</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ===== SOFT MAROON & ROSEWOOD PALETTE ===== */
    :root {
      --bg: #120d11;                  /* Dark warm black-cherry */
      --bg-alt: #171116;              
      --card: rgba(27, 20, 26, 0.75);   /* Glassy dark maroon container */
      --card-border: rgba(122, 60, 80, 0.25);
      --line: #2b1d25;                /* Borders */
      
      --maroon: #7a2e43;              /* Deep rosewood/maroon */
      --maroon-hover: #923a52;        
      --maroon-light: #d68ca1;        /* Soft dusty rose accent */
      --gold: #caa894;                /* Soft warm taupe/gold */
      
      --ink: #f3e8ee;                 /* Warm cream main text */
      --muted: #a6939d;              /* Secondary muted text */
      
      --heading-font: "Bricolage Grotesque", "Trebuchet MS", Arial, sans-serif;
      --body-font: "DM Sans", "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--body-font);
      background:
        radial-gradient(ellipse 80% 500px at 50% 0%, rgba(122, 46, 67, 0.22), transparent 70%),
        var(--bg);
      color: var(--ink);
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    #header {
      position: relative;
      padding: 48px 20px 36px;
      text-align: center;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(to bottom, transparent 30%, var(--bg) 100%),
        linear-gradient(rgba(202, 168, 148, .04) 1px, transparent 1px) 0 0 / 36px 36px,
        linear-gradient(90deg, rgba(202, 168, 148, .04) 1px, transparent 1px) 0 0 / 36px 36px;
    }

    #title {
      font-family: var(--heading-font);
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: -1px;
      color: #ffffff;
      margin-bottom: 6px;
    }

    #subtitle {
      font-size: 13px;
      color: var(--gold);
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* NAVIGATION MENU IFRAME */
    #menu {
      background-color: transparent;
      border-bottom: 1px solid var(--line);
      padding: 0;
    }

    #iframe {
      display: block;
      width: 100%;
      height: 55px;
      border: none;
      background-color: transparent;
    }

    /* MAIN CONTENT AREA */
    #content {
      flex: 1;
      width: 92%;
      max-width: 900px;
      margin: 40px auto;
      padding: 48px 36px;
      background: var(--card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--card-border);
      border-top: 3px solid var(--maroon-light);
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    .content-line {
      width: 48px;
      height: 3px;
      background-color: var(--maroon-light);
      margin: 0 auto 24px;
      border-radius: 99px;
    }

    #content h2 {
      font-family: var(--heading-font);
      color: #ffffff;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    #content p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
      max-width: 50ch;
      margin: 0 auto;
    }

    /* FOOTER */
    #footer {
      background-color: #0b0709;
      color: var(--muted);
      padding: 24px 20px;
      text-align: center;
      border-top: 1px solid var(--line);
    }

    #footnote {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.4px;
      color: var(--muted);
    }

    /* PHONE LAYOUT */
    @media (max-width: 600px) {
      #header {
        padding: 36px 15px 28px;
      }

      #title {
        font-size: 26px;
      }

      #subtitle {
        font-size: 11px;
      }

      #content {
        width: 90%;
        margin: 28px auto;
        padding: 32px 20px;
      }

      #content h2 {
        font-size: 22px;
      }

      #content p {
        font-size: 14px;
      }

      #iframe {
        height: 60px;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div id="header">
    <h1 id="title">My Personal Pages</h1>
    <p id="subtitle">TTTM2113 &bull; Web Programming &bull; UKM</p>
  </div>

  <!-- Navigation Menu -->
  <div id="menu">
    <iframe
      id="iframe"
      src="menu.html"
      title="Navigation Menu"
      allowtransparency="true">
    </iframe>
  </div>

  <!-- Main Content -->
  <div id="content">
    <div class="content-line"></div>

    <h2>Welcome</h2>

    <p>
      Please select an option from the navigation menu above
      to explore my personal pages and web programming work.
    </p>
  </div>

  <!-- Footer -->
  <div id="footer">
    <span id="footnote">
      Web Programming &#64; UKM &trade;
    </span>
  </div>

</body>
</html>
